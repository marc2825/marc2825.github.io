name: Check Portfolio

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      check_external_links:
        description: "Check live external links as well as browser tests"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  external-links:
    if: github.event_name == 'workflow_dispatch' && inputs.check_external_links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm run test:links
