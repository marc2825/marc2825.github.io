name: Update Public Repository List

on:
  schedule:
    - cron: "23 0 * * 1,4" # Monday and Thursday at 09:23 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-public-repository-list

jobs:
  update-list:
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: node scripts/update-public-repos.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit README changes
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md
          git commit -m "docs: update public repository list"
          git push
